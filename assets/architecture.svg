<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 270" width="1180" height="270" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- solid background so the diagram reads the same in light and dark themes -->
  <rect x="0" y="0" width="1180" height="270" rx="12" fill="#ffffff"/>

  <!-- arrows -->
  <g fill="none" stroke="#475569" stroke-width="2">
    <path d="M170,135 H200 V60 H226" marker-end="url(#arrow)"/>
    <path d="M200,135 V210 H226" marker-end="url(#arrow)"/>
    <path d="M446,60 H476 V118 H526" marker-end="url(#arrow)"/>
    <path d="M446,210 H476 V152 H526" marker-end="url(#arrow)"/>
    <path d="M720,135 H806" marker-end="url(#arrow)"/>
    <path d="M950,135 H996" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="512" y="52">K action chunks</text>
    <text x="490" y="232">latent z</text>
    <text x="764" y="125">imagined</text>
    <text x="764" y="157">latents</text>
  </g>

  <!-- nodes -->
  <g stroke-width="2">
    <rect x="20" y="100" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="230" y="28" width="216" height="64" rx="10" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="230" y="178" width="216" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="530" y="100" width="190" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="810" y="100" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="1000" y="100" width="160" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  </g>

  <!-- node text -->
  <g text-anchor="middle" fill="#0f172a">
    <text x="95" y="130" font-size="15" font-weight="bold">Observation</text>
    <text x="95" y="150" font-size="12.5">agent + wrist images,</text>
    <text x="95" y="164" font-size="12.5">proprio</text>

    <text x="338" y="55" font-size="15" font-weight="bold">Flow-matching policy</text>
    <text x="338" y="76" font-size="12.5">frozen, samples K chunks</text>

    <text x="338" y="205" font-size="15" font-weight="bold">Encoder</text>
    <text x="338" y="226" font-size="12.5">frozen DINOv2 + fusion transformer</text>

    <text x="625" y="130" font-size="15" font-weight="bold">Latent dynamics</text>
    <text x="625" y="150" font-size="12.5">ensemble of M</text>
    <text x="625" y="164" font-size="12.5">residual MLPs</text>

    <text x="880" y="132" font-size="15" font-weight="bold">Progress head</text>
    <text x="880" y="153" font-size="12.5">g(z) per member</text>

    <text x="1080" y="130" font-size="15" font-weight="bold">Score μ − λσ</text>
    <text x="1080" y="150" font-size="12.5">pick best chunk</text>
    <text x="1080" y="164" font-size="12.5">or fall back</text>
  </g>
</svg>
